<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050509"><title>JARVIS · Red Neural</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050509;color:#f5d5d9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}.overlay{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 25%,rgba(0,0,0,.62) 100%)}header{position:absolute;top:env(safe-area-inset-top);left:0;right:0;padding:25px 23px;display:flex;align-items:center;justify-content:space-between;letter-spacing:.22em;font-size:11px;color:#ff7c89;text-shadow:0 0 15px #f22}.brand{font-size:17px;font-weight:800;letter-spacing:.3em;color:#fff}.status{display:flex;gap:8px;align-items:center}.dot{width:7px;height:7px;border-radius:50%;background:#ff405c;box-shadow:0 0 12px #ff2449;animation:blink 2s infinite}@keyframes blink{50%{opacity:.25}}.center{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;pointer-events:none}.center h1{font-size:clamp(29px,9vw,49px);font-weight:300;letter-spacing:.45em;margin:0 0 12px;padding-left:.45em;text-shadow:0 0 26px #ff1c49}.center p{font-size:10px;letter-spacing:.28em;color:#ff8290;margin:0}.bottom{position:absolute;bottom:calc(25px + env(safe-area-inset-bottom));left:18px;right:18px;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}button,a.btn{pointer-events:auto;border:1px solid #a82b42;background:rgba(28,4,12,.85);color:#ffe5e9;border-radius:30px;padding:13px 16px;font:600 12px -apple-system,BlinkMacSystemFont,sans-serif;letter-spacing:.06em;text-decoration:none;box-shadow:0 0 16px #ff173022;cursor:pointer}button:active,a.btn:active{background:#8b1832}.hint{position:absolute;bottom:calc(90px + env(safe-area-inset-bottom));width:100%;text-align:center;color:#8c6570;font-size:10px;letter-spacing:.08em;padding:0 20px}#msg{position:absolute;top:calc(75px + env(safe-area-inset-top));left:20px;right:20px;text-align:center;font-size:12px;color:#f6a8b0;min-height:20px}</style></head><body><canvas id="c"></canvas><div class="overlay"></div><header><div class="brand">JARVIS</div><div class="status"><span class="dot"></span> NEURAL ONLINE</div></header><div id="msg"></div><div class="center"><h1>JARVIS</h1><p>RED NEURAL INTERFACE</p></div><div class="hint">VISUELLE DEMO · NICHT MIT CHATGPT VERBUNDEN</div><div class="bottom"><button id="pulse">◉ IMPULS</button><button id="mic">🎤 MIKROFON</button><a class="btn" href="https://chatgpt.com/">↗ CHATGPT</a></div><script>(()=>{const c=document.getElementById('c'),ctx=c.getContext('2d');let w,h,dpr,nodes=[],pulse=0,energy=.3,audioCtx,analyser,stream,micOn=false;const msg=document.getElementById('msg');function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;c.width=w*dpr;c.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);const count=Math.min(105,Math.max(55,Math.round(w*h/4600)));nodes=Array.from({length:count},()=>({a:Math.random()*Math.PI*2,r:Math.sqrt(Math.random()),speed:(Math.random()-.5)*.00065,phase:Math.random()*7,size:Math.random()*1.7+.7}));}addEventListener('resize',resize);resize();let last=0;function frame(t){const dt=Math.min(40,t-last||16);last=t;ctx.clearRect(0,0,w,h);ctx.fillStyle='#050509';ctx.fillRect(0,0,w,h);if(analyser){const arr=new Uint8Array(analyser.frequencyBinCount);analyser.getByteFrequencyData(arr);const avg=arr.reduce((a,b)=>a+b,0)/arr.length/255;energy=energy*.8+Math.max(.15,avg*2.2)*.2;}else energy=.24+.08*Math.sin(t*.0017);pulse*=.97;const cx=w/2,cy=h*.48,rad=Math.min(w*.47,h*.33,270)*(1+.035*Math.sin(t*.0008)+pulse*.11);const pos=nodes.map(p=>{p.a+=p.speed*dt;const rr=(.13+p.r*.87)*rad;return{x:cx+Math.cos(p.a+t*.00008+p.phase*.2)*rr,y:cy+Math.sin(p.a+t*.00008+p.phase*.2)*rr*.92,size:p.size}});const grd=ctx.createRadialGradient(cx,cy,5,cx,cy,rad*1.35);grd.addColorStop(0,'rgba(115,8,30,.15)');grd.addColorStop(.5,'rgba(90,0,18,.06)');grd.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=grd;ctx.fillRect(0,0,w,h);ctx.lineWidth=.7;for(let i=0;i<pos.length;i++)for(let j=i+1;j<pos.length;j++){const a=pos[i],b=pos[j],dist=Math.hypot(a.x-b.x,a.y-b.y);if(dist<rad*.38){ctx.strokeStyle=`rgba(255,42,73,${(1-dist/(rad*.38))*(.11+energy*.48+pulse*.25)})`;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}}for(const p of pos){ctx.shadowBlur=12+energy*20+pulse*15;ctx.shadowColor='#ff2749';ctx.fillStyle='#ff5870';ctx.beginPath();ctx.arc(p.x,p.y,p.size*(1+energy*.55+pulse*.5),0,Math.PI*2);ctx.fill();}ctx.shadowBlur=0;for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(cx,cy,rad*(.27+i*.19)+Math.sin(t*.001+i)*3,0,Math.PI*2);ctx.strokeStyle=`rgba(255,44,75,${.19-i*.05+energy*.09+pulse*.12})`;ctx.lineWidth=1;ctx.stroke();}requestAnimationFrame(frame);}requestAnimationFrame(frame);document.getElementById('pulse').onclick=()=>{pulse=1;msg.textContent='NEURALER IMPULS AKTIV';setTimeout(()=>msg.textContent='',1800)};document.getElementById('mic').onclick=async()=>{if(micOn){stream?.getTracks().forEach(t=>t.stop());await audioCtx?.close();analyser=null;micOn=false;document.getElementById('mic').textContent='🎤 MIKROFON';msg.textContent='Mikrofon ausgeschaltet';return;}try{if(!navigator.mediaDevices?.getUserMedia)throw Error('Mikrofon benötigt eine sichere HTTPS-Seite (nicht lokale Datei).');stream=await navigator.mediaDevices.getUserMedia({audio:true});audioCtx=new (window.AudioContext||window.webkitAudioContext)();await audioCtx.resume();const source=audioCtx.createMediaStreamSource(stream);analyser=audioCtx.createAnalyser();analyser.fftSize=256;source.connect(analyser);micOn=true;document.getElementById('mic').textContent='■ MIKRO AUS';msg.textContent='Grafik reagiert auf Umgebungsgeräusche';}catch(e){msg.textContent='Mikrofon nicht verfügbar: '+e.message;}};})();</script></body></html>
