<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08080b"><title>JARVIS • Red Neural</title><style>*{box-sizing:border-box}body{margin:0;background:#050509;color:#f7e8e8;font-family:system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}canvas{position:fixed;inset:0;width:100%;height:100%}.shade{position:fixed;inset:0;background:radial-gradient(ellipse at center,transparent 15%,#050509aa 95%);pointer-events:none}.app{position:relative;z-index:1;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 28px) 20px calc(env(safe-area-inset-bottom) + 28px)}header{text-align:center;letter-spacing:.32em}h1{font-size:30px;font-weight:300;margin:0;color:#fff;text-shadow:0 0 25px #f22}small{color:#ff7272;font-size:10px;letter-spacing:.23em}.center{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;width:100%;pointer-events:none}.ring{width:min(72vw,320px);height:min(72vw,320px);border:1px solid #ff33334d;border-radius:50%;box-shadow:0 0 40px #f004, inset 0 0 50px #f002;display:grid;place-items:center;position:relative;animation:breath 4s ease-in-out infinite}.ring:before,.ring:after{content:"";position:absolute;inset:15px;border:1px dashed #f335;border-radius:50%;animation:spin 35s linear infinite}.ring:after{inset:33px;animation-direction:reverse;animation-duration:25s}.core{font-size:54px;color:#ff4646;text-shadow:0 0 25px #f22,0 0 65px #f22;filter:drop-shadow(0 0 14px #e22)}.listening .ring{animation:breath .65s ease-in-out infinite;box-shadow:0 0 70px #f44a,inset 0 0 70px #f226}.speaking .ring{animation:breath .35s ease-in-out infinite}.status{margin-top:35px;color:#ff8585;letter-spacing:.2em;text-align:center;font-size:12px}.panel{width:min(100%,500px);background:#0c0c13d9;border:1px solid #ff33333d;border-radius:18px;padding:16px;box-shadow:0 0 30px #0009}.output{min-height:48px;text-align:center;font-size:14px;line-height:1.5;color:#e8dada;margin-bottom:14px}.controls{display:flex;gap:10px}.controls button{flex:1;min-height:54px;border:1px solid #ff505077;border-radius:12px;background:linear-gradient(#391117,#170a0f);color:#fff;font-weight:700;letter-spacing:.04em;font-size:13px}.controls button:active{transform:scale(.98)}.controls button.secondary{background:#12121a;border-color:#555}.hint{font-size:11px;text-align:center;color:#a88;margin-top:12px;line-height:1.5}@keyframes spin{to{transform:rotate(360deg)}}@keyframes breath{50%{transform:scale(1.045);filter:brightness(1.3)}}@media(prefers-reduced-motion:reduce){.ring,.ring:before,.ring:after{animation:none}}</style></head><body><canvas id="net"></canvas><div class="shade"></div><div class="app" id="app"><header><h1>J A R V I S</h1><small>RED NEURAL INTERFACE</small></header><section class="center"><div class="ring"><div class="core">◈</div></div><div class="status" id="status">SYSTEM BEREIT</div></section><section class="panel"><div class="output" id="output" aria-live="polite">Tippe auf das Mikrofon und sprich mit JARVIS.</div><div class="controls"><button id="mic">🎙 SPRECHEN</button><button id="demo" class="secondary">▶ DEMO</button></div><div class="hint">Spracherkennung benötigt Mikrofonfreigabe und einen kompatiblen Browser. Die Demo funktioniert ohne API-Schlüssel.</div></section></div><script>(()=>{'use strict';const canvas=document.getElementById('net'),ctx=canvas.getContext('2d'),app=document.getElementById('app'),status=document.getElementById('status'),out=document.getElementById('output'),mic=document.getElementById('mic');let w,h,dpr,points=[],pulse=0,mode='idle';function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);const count=Math.min(95,Math.max(42,Math.round(w*h/9500)));points=Array.from({length:count},()=>({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.45,vy:(Math.random()-.5)*.45,r:Math.random()*1.8+.6}));}addEventListener('resize',resize);resize();let last=0;function draw(t){requestAnimationFrame(draw);if(t-last<30)return;last=t;ctx.clearRect(0,0,w,h);const boost=mode==='listening'?2.3:mode==='speaking'?1.9:1;for(let i=0;i<points.length;i++){const p=points[i];p.x+=p.vx*boost;p.y+=p.vy*boost;if(p.x<0||p.x>w)p.vx*=-1;if(p.y<0||p.y>h)p.vy*=-1;for(let j=i+1;j<points.length;j++){const q=points[j],dx=p.x-q.x,dy=p.y-q.y,dist=Math.hypot(dx,dy);if(dist<115){ctx.strokeStyle=`rgba(255,35,55,${(1-dist/115)*.32*boost})`;ctx.lineWidth=.7;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke();}}ctx.fillStyle=`rgba(255,${mode==='idle'?65:100},85,.9)`;ctx.shadowColor='#ff2035';ctx.shadowBlur=8*boost;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();}ctx.shadowBlur=0;pulse+=.04;}requestAnimationFrame(draw);function setMode(m,label){mode=m;app.classList.remove('listening','speaking');if(m!=='idle')app.classList.add(m);status.textContent=label;}function say(text){out.textContent=text;if(!('speechSynthesis'in window)){setMode('idle','SYSTEM BEREIT');return;}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='de-DE';u.rate=.95;u.onstart=()=>setMode('speaking','JARVIS SPRICHT');u.onend=()=>setMode('idle','SYSTEM BEREIT');u.onerror=()=>setMode('idle','SYSTEM BEREIT');speechSynthesis.speak(u);}function reply(input){const s=input.toLowerCase();if(/hallo|hey|guten tag/.test(s))return 'Hallo! JARVIS ist online und bereit.';if(/wie spät|uhrzeit|wie viel uhr/.test(s))return 'Es ist '+new Date().toLocaleTimeString('de-CH',{hour:'2-digit',minute:'2-digit'})+' Uhr.';if(/datum|welcher tag/.test(s))return 'Heute ist '+new Date().toLocaleDateString('de-CH',{weekday:'long',day:'numeric',month:'long'})+'.';if(/wer bist|dein name/.test(s))return 'Ich bin deine JARVIS Demo-Oberfläche mit Spracherkennung.';if(/danke/.test(s))return 'Sehr gerne.';return 'Ich habe dich verstanden: '+input+'. Für intelligente Antworten muss noch eine KI-Schnittstelle verbunden werden.';}const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;let rec;if(SpeechRecognition){rec=new SpeechRecognition();rec.lang='de-DE';rec.interimResults=true;rec.continuous=false;rec.onresult=e=>{let transcript='';for(let i=0;i<e.results.length;i++)transcript+=e.results[i][0].transcript;out.textContent='Du: '+transcript;if(e.results[e.results.length-1].isFinal)setTimeout(()=>say(reply(transcript)),200);};rec.onerror=e=>{setMode('idle','MIKROFON NICHT VERFÜGBAR');out.textContent='Spracherkennung fehlgeschlagen: '+e.error+'. Prüfe Mikrofonfreigabe und Browser.';};rec.onend=()=>{if(mode==='listening')setMode('idle','SYSTEM BEREIT');};}mic.onclick=()=>{if(!rec){out.textContent='Dieser Browser unterstützt die Spracherkennung nicht. Probiere Chrome auf Android oder einen unterstützten Browser.';return;}try{speechSynthesis.cancel();rec.start();setMode('listening','ICH HÖRE ZU ...');out.textContent='Sprich jetzt ...';}catch(e){out.textContent='Bitte kurz warten und erneut versuchen.';}};document.getElementById('demo').onclick=()=>say('Guten Tag. JARVIS ist online. Alle Systeme sind bereit.');})();</script></body></html>
